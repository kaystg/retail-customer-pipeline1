name: Customer Processing Pipeline

on:
  push:
    branches:
      - main

jobs:
  customer-processing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Customer Processing
        run: python customer_processing.py

      - name: Display Success Message
        run: echo "Customer Processing Executed Successfully"
deploy_dev:
     needs: validate
     runs-on: ubuntu-latest
     environment: DEV

 

     steps:
       - name: Deploy to DEV
         run : echo "Deploying to development"
   deploy_qa:
     needs: validate
     runs-on: ubuntu-latest
     environment: QA

 

     steps:
       - name: Deploy to QA
         run : echo "Deploying to QA"

 

  deploy_prod:
     needs: validate
     runs-on: ubuntu-latest
     environment: PROD

 

     steps:
       - name: Deploy to PROD
         run : echo "Deploying to Production"
